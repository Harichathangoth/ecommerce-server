services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ecommerce_backend_dev
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run start:dev
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgrespassword
      - DB_NAME=ecommerce_db
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: ecommerce_postgres_dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ecommerce_db
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  # ============================================================
  # Nginx Reverse Proxy — Unifies Next.js + NestJS on localhost:80
  # Solves cross-origin cookie issue in development
  # ============================================================
  nginx-proxy:
    image: nginx:alpine
    container_name: ecommerce_dev_proxy
    ports:
      - "80:80"
    volumes:
      - ../nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  postgres_dev_data:
